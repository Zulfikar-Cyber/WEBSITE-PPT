<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110e">
  <meta name="description" content="Presentasi web Aqidah dan Tauhid — Kelompok 1.">
  <title>Aqidah &amp; Tauhid — Presentasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="presentation" aria-label="Presentasi Aqidah dan Tauhid">
    <div id="backgroundStack" aria-hidden="true">
      <div id="slideBackground" class="background-layer"></div>
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="pattern-drift"></div>
    </div>
    <div class="background-grade" aria-hidden="true"></div>
    <div id="sceneStage" class="scene-stage" aria-hidden="true"></div>
    <div id="spotlight" class="spotlight" aria-hidden="true"></div>
    <canvas id="dust" class="dust" aria-hidden="true"></canvas>
    <div class="hud-frame" aria-hidden="true">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <span class="edge edge-t"></span><span class="edge edge-b"></span>
    </div>

    <section id="opening" class="opening" aria-label="Opening presentasi">
      <div class="open-aurora" aria-hidden="true"></div>
      <div class="open-rings" aria-hidden="true"><i></i><i></i><i></i></div>
      <canvas id="openCanvas" class="open-canvas" aria-hidden="true"></canvas>
      <div class="open-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="open-flash" aria-hidden="true"></div>
      <div class="opening-frame opening-frame-top"><span>KELOMPOK 1</span><span>ACADEMIC PRESENTATION</span></div>
      <div class="opening-ornament scene-stage" id="openingOrnament" aria-hidden="true"></div>
      <div class="opening-center">
        <p class="opening-kicker"><span></span> PRESENTATION / 01</p>
        <h1 class="opening-title"><span class="mask"><span class="inner" data-split="chars">AQIDAH</span></span><span class="mask"><span class="inner" data-split="chars"><em>&amp;</em> TAUHID</span></span></h1>
        <div class="opening-line"><span></span></div>
      </div>
      <div class="opening-frame opening-frame-bottom"><span>12 SLIDES</span><button id="skipOpening" type="button">LEWATI INTRO <span>↗</span></button></div>
    </section>

    <header class="topbar">
      <a class="identity" href="#" aria-label="Kembali ke slide pertama">
        <span class="identity-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="identity-name">A<span>&amp;</span>T</span>
      </a>
      <div class="topbar-current">
        <span class="micro-label">PRESENTATION DECK</span>
        <span id="topSlideLabel">AQIDAH &amp; TAUHID</span>
      </div>
      <div class="topbar-actions">
        <span class="live-indicator"><i></i> LIVE DECK</span>
        <button id="overviewButton" class="utility-button" type="button" aria-label="Buka daftar slide" title="Daftar slide (O)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>SLIDES</span>
        </button>
        <button id="fullscreenButton" class="utility-button fullscreen-button" type="button" aria-label="Aktifkan layar penuh" title="Layar penuh (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
          <span>FULLSCREEN</span>
        </button>
      </div>
    </header>

    <div class="chapter-rail" aria-hidden="true"><span id="railFill"></span></div>
    <section id="slideContent" aria-live="polite" aria-atomic="true"></section>

    <footer class="bottom-hud" aria-label="Navigasi presentasi">
      <div class="hud-left"><span class="hud-dot"></span><span id="slideTypeLabel">OPENING</span></div>
      <div class="hud-center">
        <button id="previousButton" class="nav-arrow" type="button" aria-label="Slide sebelumnya" title="Sebelumnya (←)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="progress-zone">
          <div id="progressSegments" class="progress-segments" aria-label="Progres slide"></div>
          <div class="progress-caption"><span id="slideCounter">01 / 12</span><span id="progressPercent">08%</span></div>
        </div>
        <button id="nextButton" class="nav-arrow nav-next" type="button" aria-label="Slide berikutnya" title="Berikutnya (→)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="hud-right"><span class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> NAVIGATE</span><button id="soundMotionButton" class="motion-button" type="button" aria-pressed="false" aria-label="Kurangi efek gerak" title="Kurangi efek gerak"><span></span></button></div>
    </footer>

    <aside id="overviewPanel" class="overview-panel" aria-hidden="true" aria-labelledby="overviewTitle">
      <div class="overview-scrim" data-close-overview="true"></div>
      <div class="overview-sheet">
        <header class="overview-header">
          <div><p class="micro-label">PRESENTATION INDEX</p><h2 id="overviewTitle">Daftar <em>slide.</em></h2></div>
          <button id="closeOverviewButton" class="overview-close" type="button" aria-label="Tutup daftar slide">×</button>
        </header>
        <div id="overviewGrid" class="overview-grid"></div>
        <footer class="overview-footer"><span>Gunakan tombol panah untuk menavigasi</span><span>12 SLIDES / KELOMPOK 1</span></footer>
      </div>
    </aside>

    <div id="announcement" class="announcement" aria-live="polite"></div>
  </main>

  <script src="js/materi.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/presentation.js"></script>
  <script src="js/fx.js"></script>
</body>
</html>
